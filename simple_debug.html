<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chatbot Test</title>
    <link rel="stylesheet" href="css/chatbot.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="padding: 20px; background: #f5f5f5; font-family: Arial, sans-serif;">
    <h1>Simple Chatbot Test</h1>
    <p>Testing if chatbot loads correctly...</p>
    
    <div style="background: white; padding: 20px; border-radius: 8px; margin: 20px 0;">
        <h3>Debug Results:</h3>
        <div id="results">Loading...</div>
    </div>
    
    <!-- Chatbot Container -->
    <div id="chatbot-container"></div>
    
    <script src="js/chatbot.js"></script>
    
    <script>
        console.log('Page loaded');
        
        setTimeout(() => {
            const results = document.getElementById('results');
            let output = '';
            
            // Check if chatbot class exists
            if (typeof AgroKartChatbot !== 'undefined') {
                output += '✅ AgroKartChatbot class loaded<br>';
            } else {
                output += '❌ AgroKartChatbot class NOT loaded<br>';
            }
            
            // Check container
            const container = document.getElementById('chatbot-container');
            if (container) {
                output += '✅ Container exists<br>';
                output += 'Container content length: ' + container.innerHTML.length + '<br>';
            } else {
                output += '❌ Container missing<br>';
            }
            
            // Check if chatbot instance exists
            if (window.chatbot) {
                output += '✅ Chatbot instance exists<br>';
            } else {
                output += '❌ Chatbot instance missing<br>';
            }
            
            // Try to create manual instance
            try {
                if (typeof AgroKartChatbot !== 'undefined') {
                    const testBot = new AgroKartChatbot();
                    output += '✅ Can create chatbot instance manually<br>';
                }
            } catch (e) {
                output += '❌ Error creating chatbot: ' + e.message + '<br>';
            }
            
            results.innerHTML = output;
        }, 2000);
        
        // Monitor for JavaScript errors
        window.addEventListener('error', (e) => {
            console.error('JS Error:', e);
            const results = document.getElementById('results');
            results.innerHTML += '<br>❌ JS Error: ' + e.message;
        });
    </script>
</body>
</html>
